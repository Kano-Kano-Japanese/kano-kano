function applyLang(value){
 const lang=ui[value]?value:'ja',u=ui[lang];
 document.documentElement.lang=lang==='zh'?'zh-CN':lang;
 document.title=u.title+' | Kano×Kano';
 const htmlKeys=['vSeller','vOperator','vAddress','vPhone','vContact','vPrice','vFees','vPayment','vPaymentTiming','vDelivery','vBookingCancel','vRefund','vRenewalStop','vEnvironment'];
 ['pageTitle','pageNote','lSeller','lOperator','lAddress','lPhone','lContact','lPrice','lFees','lPayment','lPaymentTiming','lDelivery','lBookingCancel','lRefund','lRenewalStop','lEnvironment'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=u[id==='pageTitle'?'title':id==='pageNote'?'note':id];});
 htmlKeys.forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=u[id];});
 document.getElementById('legalNote').textContent=u.legal;
 document.getElementById('backHome').textContent=u.back;document.getElementById('homeBtn').textContent=u.home;document.getElementById('bookingBtn').textContent=u.booking;document.getElementById('privacyLink').textContent=u.privacy;
 const suffix='?lang='+encodeURIComponent(lang);document.getElementById('backHome').href='index.html'+suffix;document.getElementById('homeBtn').href='index.html'+suffix;document.getElementById('bookingBtn').href='booking.html'+suffix;document.getElementById('privacyLink').href='privacy.html'+suffix;
 document.querySelectorAll('.langbar button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));localStorage.setItem('kk-language',lang);try{const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url)}catch(_){}
}
document.querySelectorAll('.langbar button').forEach(b=>b.addEventListener('click',()=>applyLang(b.dataset.lang)));
const q=new URLSearchParams(location.search).get('lang'),saved=localStorage.getItem('kk-language');applyLang(ui[q]?q:(ui[saved]?saved:'ja'));
</script>
